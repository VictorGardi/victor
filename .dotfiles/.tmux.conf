# ── Keybindings ────────────────────────────────────────────────────
bind-key -n C-t new-window
bind-key -n C-w kill-window
bind-key -n C-l next-window
bind-key -n C-h previous-window

# ── Terminal ───────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# ── Behaviour ──────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5
set -g escape-time 0

# ── Catppuccin ─────────────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Window tabs: show running command (nvim / zsh / git etc.)
set -g @catppuccin_window_text " #{pane_current_command}"
set -g @catppuccin_window_current_text " #{pane_current_command}"

# Status modules — session name shows full task e.g. grove-T-104-fix-auth-bug
set -g @catppuccin_status_modules_left  "session"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

set -g status-left-length 80
set -g status-right-length 100

run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux

# ── Pane borders ───────────────────────────────────────────────────
set -g pane-border-style        "fg=#{@thm_overlay_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"
