# ── Keybindings ────────────────────────────────────────────────────
bind-key -n C-t new-window
bind-key -n C-x kill-window
bind-key -n C-l next-window
bind-key -n C-h previous-window
bind-key r run-shell "~/bin/tmux-open-repo"

# ── Terminal ───────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# ── Behaviour ──────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5
set -g escape-time 0

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#f9e2af'

# copy mode
setw -g mode-style 'fg=#11111b,bg=#cba6f7 bold'

# panes
set -g pane-border-style 'fg=#585b70'
set -g pane-active-border-style 'fg=#b4befe'

# statusbar
set -g status-position bottom
set -g status-justify right
set -g status-style 'fg=#cdd6f4,bg=#1e1e2e'

set -g status-left ' #[fg=#11111b,bg=#b4befe] #S '
set -g status-left-length 60

set -g status-right ''
set -g status-right-length 50

set -g window-status-separator ''

setw -g window-status-current-style 'fg=#11111b,bg=#b4befe'
setw -g window-status-current-format '  #I  #W #F '

setw -g window-status-style 'fg=#cdd6f4,bg=#313244'
setw -g window-status-format '  #I  #W #F '

setw -g window-status-bell-style 'fg=#f9e2af bold'

# messages
set -g message-style 'fg=#11111b,bg=#f38ba8 bold'

# ── TPM Plugins ───────────────────────────────────────────────────
set -g @plugin 'hiroppy/tmux-agent-sidebar'

# Initialize TPM
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
